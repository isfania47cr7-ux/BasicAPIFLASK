<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="/static/style.css">
    
<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- Student Form -->
        <div class="form-container">

            <h2 id="form-title">Add Student</h2>

            <form id="student-form">

                <input type="hidden" id="student-id">

                <div class="form-group">
                    <label>Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required>
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <input
                        type="text"
                        id="course"
                        placeholder="Enter course"
                        required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                        required>
                </div>

                <button type="submit" id="submit-button">
                    Add Student
                </button>

                <button
                    type="button"
                    id="cancel-button"
                    onclick="cancelEdit()"
                    style="display:none;">
                    Cancel
                </button>

            </form>

        </div>


        <!-- Student List -->

        <div class="table-container">

            <h2>Student List</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="student-table-body">

                    <!-- JavaScript will add rows here -->

                </tbody>

            </table>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
